name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-{% raw %}${{ github.event_name }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: "v1.9.0"
  GOSEC_VERSION: "v2.30.0"
  GITLEAKS_VERSION: "v8.28.0"
  TRIVY_VERSION: "v0.76.1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race ./...
      - run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Install security tools
        run: |
          set -eu
          bin="$(go env GOPATH)/bin"
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "${bin}/gitleaks"
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          install -m 0755 /tmp/trivy "${bin}/trivy"
          echo "${bin}" >> "${GITHUB_PATH}"
      - name: govulncheck
        if: always()
        run: govulncheck ./...
      - name: gosec
        if: always()
        run: gosec -quiet -fmt sarif -out gosec.sarif ./...
      - name: gitleaks
        if: always()
        run: >
          gitleaks detect --source . --no-git --redact --config .gitleaks.toml
          --report-format sarif --report-path gitleaks.sarif
      - name: trivy secret
        if: always()
        run: >
          trivy fs --scanners secret --exit-code 1
          --format sarif --output trivy-secret.sarif .
      - name: trivy vulnerabilities (informativo)
        if: always()
        run: >
          trivy fs --scanners vuln --exit-code 0
          --format sarif --output trivy-vuln.sarif .
{% for report in ["gosec", "gitleaks", "trivy-secret", "trivy-vuln"] %}
      - name: Publicar SARIF de {{ report }}
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: {{ report }}.sarif
          category: {{ report }}
{% endfor %}

{% if cookiecutter.use_db == "yes" or cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
{% if cookiecutter.use_db == "yes" %}
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: {{ cookiecutter.project_slug }}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d {{ cookiecutter.project_slug }}_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
{% endif %}
{% if cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
{% endif %}
    env:
      STAGE: testing
{% if cookiecutter.use_db == "yes" %}
      TEST_DATABASE_URL: postgres://dev:dev@127.0.0.1:5432/{{ cookiecutter.project_slug }}_test?sslmode=disable
{% endif %}
{% if cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
{% endif %}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -tags=integration ./...
{% endif %}
