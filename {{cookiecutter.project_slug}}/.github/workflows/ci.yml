name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race ./...
      - run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
{% if cookiecutter.use_db == "yes" or cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
  integration:
    runs-on: ubuntu-latest
{% if cookiecutter.use_db == "yes" or cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
    services:
{% endif %}
{% if cookiecutter.use_db == "yes" %}
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: {{ cookiecutter.project_slug }}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d {{ cookiecutter.project_slug }}_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
{% endif %}
{% if cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
{% endif %}
    env:
      STAGE: testing
{% if cookiecutter.use_db == "yes" %}
      TEST_DATABASE_URL: postgres://dev:dev@127.0.0.1:5432/{{ cookiecutter.project_slug }}_test?sslmode=disable
{% endif %}
{% if cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
{% endif %}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -tags=integration ./...
{% endif %}
