version: "2"

run:
  timeout: 5m
  tests: true
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - whitespace
    - gosec
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - revive
      - path: tools/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
