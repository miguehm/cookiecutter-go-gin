services:
{% if cookiecutter.use_db == "yes" %}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: {{ cookiecutter.project_slug }}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d {{ cookiecutter.project_slug }}"]
      interval: 2s
      timeout: 5s
      retries: 30
{% endif %}
{% if cookiecutter.use_redis == "yes" or cookiecutter.use_asynq == "yes" %}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "dev"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
{% endif %}
{% if cookiecutter.use_db == "yes" %}
  atlas:
    image: arigaio/atlas:latest
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - migrate
      - apply
      - --url
      - postgres://dev:dev@postgres:5432/{{ cookiecutter.project_slug }}?sslmode=disable
      - --dir
      - file:///migrations
{% endif %}
