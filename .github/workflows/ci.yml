name: template-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  COOKIECUTTER_VERSION: "2.7.1"
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  GOVULNCHECK_VERSION: "v1.9.0"
  GOSEC_VERSION: "v2.30.0"
  GITLEAKS_VERSION: "v8.28.0"
  TRIVY_VERSION: "v0.76.1"
  REQUIRE_GOVULNCHECK: "1"
  REQUIRE_SECURITY: "1"

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: template-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-template-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-template-

      - name: Install tools
        run: |
          set -eu
          bin="$(go env GOPATH)/bin"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "${bin}/gitleaks"
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          install -m 0755 /tmp/trivy "${bin}/trivy"
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Run template harness
        run: make test-template

      - name: gitleaks
        if: always()
        run: >
          gitleaks detect --source . --no-git --redact --config .gitleaks.toml
          --report-format sarif --report-path gitleaks.sarif

      - name: trivy secret
        if: always()
        run: >
          trivy fs --scanners secret --exit-code 1 --skip-dirs .opencode
          --format sarif --output trivy-secret.sarif .

      - name: trivy vulnerabilities (informativo)
        if: always()
        run: >
          trivy fs --scanners vuln --exit-code 0 --skip-dirs .opencode
          --format sarif --output trivy-vuln.sarif .

      - name: Publicar SARIF de gitleaks
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Publicar SARIF de trivy secret
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

      - name: Publicar SARIF de trivy vuln
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vuln
